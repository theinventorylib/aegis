openapi: 3.0.3
info:
  title: LocalMan API
  description: API documentation for LocalMan
  version: 1.0.0
paths:
  /api/auth/admin/stats:
    get:
      tags:
        - Admin
      summary: Admin stats
      description: Get platform statistics (admin only)
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/admin/users:
    get:
      tags:
        - Admin
      summary: List users
      description: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/admin/users/{id}:
    get:
      tags:
        - Admin
      summary: Get user
      description: Get user details by ID (admin only)
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
    delete:
      tags:
        - Admin
      summary: Delete user
      description: Delete a user account (admin only)
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/admin/users/{id}/ban:
    post:
      tags:
        - Admin
      summary: Ban user
      description: Ban a user with reason and expiry (admin only)
      requestBody:
        description: Ban details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanUserRequest"
        required: true
      responses:
        "200":
          description: User banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/admin/users/{id}/disable:
    post:
      tags:
        - Admin
      summary: Disable user
      description: Disable a user account (admin only)
      responses:
        "200":
          description: User disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/admin/users/{id}/enable:
    post:
      tags:
        - Admin
      summary: Enable user
      description: Enable a user account (admin only)
      responses:
        "200":
          description: User enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/admin/users/{id}/unban:
    post:
      tags:
        - Admin
      summary: Unban user
      description: Remove ban from user (admin only)
      responses:
        "200":
          description: User unbanned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/default/logout:
    post:
      tags:
        - default
      summary: Logout
      description: Invalidate the current session and log out the user
      responses:
        "200":
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/default/session:
    get:
      tags:
        - Session
      summary: Get current session
      description: Retrieve the current session information
      responses:
        "200":
          description: Current session information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/default/session/refresh:
    post:
      tags:
        - Session
      summary: Refresh session
      description: Refresh an existing session using a refresh token
      requestBody:
        description: Refresh token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: Session refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/default/sessions:
    get:
      tags:
        - Session
      summary: List user sessions
      description: Retrieve all active sessions for the current user
      responses:
        "200":
          description: List of active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
    delete:
      tags:
        - Session
      summary: Revoke all sessions
      description: Revoke all active sessions for the current user
      responses:
        "200":
          description: All sessions revoked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/default/sessions/{id}:
    delete:
      tags:
        - Session
      summary: Revoke session
      description: Revoke a specific session by ID
      responses:
        "200":
          description: Session revoked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/default/user:
    get:
      tags:
        - default
      summary: Get current user
      description: Retrieve the currently authenticated user's information
      responses:
        "200":
          description: User information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/email-otp/send:
    post:
      tags:
        - EmailOTP
        - Email OTP
      summary: Send Email OTP
      description: Send a one-time password via email to the authenticated user's
        email address
      requestBody:
        description: Email address to send OTP to
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOTPRequest"
        required: true
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to send email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/email-otp/verify:
    post:
      tags:
        - EmailOTP
      summary: Verify Email OTP
      description: Verify a one-time password sent via email
      requestBody:
        description: Email address and OTP code
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOTPRequest"
        required: true
      responses:
        "200":
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          description: Invalid request or incorrect OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: OTP expired or not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/jwt/.well-known/jwks.json:
    get:
      tags:
        - JWT
      summary: Get JWKS
      description: Retrieve the JSON Web Key Set for JWT verification
      responses:
        "200":
          description: JWKS retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
        "500":
          description: Failed to retrieve JWKS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/jwt/getAccessToken:
    post:
      tags:
        - JWT
      summary: Get access token
      description: Generate a new access token for the authenticated user
      responses:
        "200":
          description: Access token generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to generate token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/jwt/jwks:
    get:
      tags:
        - JWT
      summary: Get JWKS (convenience endpoint)
      description: Retrieve the JSON Web Key Set for JWT verification
      responses:
        "200":
          description: JWKS retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
        "500":
          description: Failed to retrieve JWKS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/jwt/logout:
    post:
      tags:
        - JWT
      summary: Logout and blacklist tokens
      description: Logout the user and blacklist their JWT tokens (requires Redis)
      responses:
        "200":
          description: Successfully logged out and tokens blacklisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/jwt/refreshToken:
    post:
      tags:
        - JWT
      summary: Refresh JWT tokens
      description: Use a refresh token to obtain new access and refresh tokens
      requestBody:
        description: Refresh token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/jwt/token:
    post:
      tags:
        - JWT
      summary: Generate JWT token pair
      description: Generate access and refresh JWT tokens for the authenticated user
      responses:
        "200":
          description: Token pair generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to generate tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/sms/login:
    post:
      tags:
        - SMS
      summary: Login with phone and password
      description: Authenticate using phone number and password
      requestBody:
        description: Phone number and password credentials
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginWithPhoneRequest"
        required: true
      responses:
        "200":
          description: Login successful, session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/sms/register:
    post:
      tags:
        - SMS
      summary: Register with phone and password
      description: Create a new account using phone number and password
      requestBody:
        description: Phone number and password credentials
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWithPhoneRequest"
        required: true
      responses:
        "201":
          description: Registration successful, session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request or phone number already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/sms/send:
    post:
      tags:
        - SMS
      summary: Send SMS OTP
      description: Send a one-time password via SMS to the authenticated user's phone number
      requestBody:
        description: Phone number to send OTP to
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOTPRequest"
        required: true
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to send SMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - cookieAuth: []
        - bearerAuth: []
  /api/auth/sms/verify:
    post:
      tags:
        - SMS
      summary: Verify SMS OTP
      description: Verify a one-time password sent via SMS
      requestBody:
        description: Phone number and OTP code
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOTPRequest"
        required: true
      responses:
        "200":
          description: OTP verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          description: Invalid request or incorrect OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: OTP expired or not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    AccessToken:
      type: object
      properties:
        access_expiry:
          type: string
          format: date-time
          example: 2026-02-01T18:37:21Z
        access_token:
          type: string
      required:
        - access_token
        - access_expiry
    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
      required:
        - totalUsers
    AdminUser:
      type: object
      properties:
        avatar:
          type: string
        banCounter:
          type: integer
        banExpiry:
          type: string
          format: date-time
          example: 2026-02-01T18:37:21Z
        banReason:
          type: string
        banned:
          type: boolean
        createdAt:
          type: string
          format: date-time
          example: 2026-02-01T18:37:21Z
        disabled:
          type: boolean
        email:
          type: string
        id:
          type: string
        metadata:
          type: string
          description: Base64 encoded bytes
        name:
          type: string
        role:
          type: string
        updatedAt:
          type: string
          format: date-time
          example: 2026-02-01T18:37:21Z
      required:
        - id
        - createdAt
        - updatedAt
        - disabled
        - role
        - banned
    BanUserRequest:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
          example: 2026-02-01T18:37:21Z
        reason:
          type: string
      required:
        - reason
    EnrichedUser:
      type: object
      properties:
        avatar:
          type: string
        createdAt:
          type: string
          format: date-time
          example: 2026-02-01T18:37:21Z
        disabled:
          type: boolean
        email:
          type: string
        id:
          type: string
        metadata:
          type: string
          description: Base64 encoded bytes
        name:
          type: string
        updatedAt:
          type: string
          format: date-time
          example: 2026-02-01T18:37:21Z
      required:
        - id
        - createdAt
        - updatedAt
        - disabled
    Error:
      type: object
      description: Error response
      properties:
        error:
          type: string
          description: Error message
        success:
          type: boolean
          description: Always false for errors
      required:
        - success
        - error
    JWKS:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
              description: Any value
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    LoginWithPhoneRequest:
      type: object
      properties:
        password:
          type: string
        phoneNumber:
          type: string
      required:
        - phoneNumber
        - password
    RefreshTokenRequest:
      type: object
      additionalProperties:
        type: string
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
      required:
        - name
        - email
        - password
    RegisterWithPhoneRequest:
      type: object
      properties:
        avatar:
          type: string
        name:
          type: string
        password:
          type: string
        phoneNumber:
          type: string
      required:
        - phoneNumber
        - password
    SendOTPRequest:
      type: object
      properties:
        phoneNumber:
          type: string
        purpose:
          type: string
        userId:
          type: string
      required:
        - phoneNumber
        - userId
        - purpose
    Session:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          example: 2026-02-01T18:37:21Z
        expiresAt:
          type: string
          format: date-time
          example: 2026-02-01T18:37:21Z
        id:
          type: string
        ipAddress:
          type: string
        metadata:
          type: string
          description: Base64 encoded bytes
        refreshToken:
          type: string
        token:
          type: string
        userAgent:
          type: string
        userId:
          type: string
      required:
        - id
        - userId
        - token
        - expiresAt
        - createdAt
    SessionWithUser:
      type: object
      properties:
        session:
          type: object
          properties:
            createdAt:
              type: string
              format: date-time
              example: 2026-02-01T18:37:21Z
            expiresAt:
              type: string
              format: date-time
              example: 2026-02-01T18:37:21Z
            id:
              type: string
            ipAddress:
              type: string
            metadata:
              type: string
              description: Base64 encoded bytes
            refreshToken:
              type: string
            token:
              type: string
            userAgent:
              type: string
            userId:
              type: string
          required:
            - id
            - userId
            - token
            - expiresAt
            - createdAt
        user:
          type: object
          properties:
            avatar:
              type: string
            createdAt:
              type: string
              format: date-time
              example: 2026-02-01T18:37:21Z
            disabled:
              type: boolean
            email:
              type: string
            id:
              type: string
            metadata:
              type: string
              description: Base64 encoded bytes
            name:
              type: string
            updatedAt:
              type: string
              format: date-time
              example: 2026-02-01T18:37:21Z
          required:
            - id
            - createdAt
            - updatedAt
            - disabled
    Success:
      type: object
      description: Success response
      properties:
        message:
          type: string
          description: Success message
        success:
          type: boolean
          description: Always true for success
      required:
        - success
    TokenPair:
      type: object
      properties:
        access_expiry:
          type: string
          format: date-time
          example: 2026-02-01T18:37:21Z
        access_token:
          type: string
        refresh_expiry:
          type: string
          format: date-time
          example: 2026-02-01T18:37:21Z
        refresh_token:
          type: string
      required:
        - access_token
        - access_expiry
        - refresh_token
        - refresh_expiry
    User:
      type: object
      properties:
        avatar:
          type: string
        createdAt:
          type: string
          format: date-time
          example: 2026-02-01T18:37:21Z
        disabled:
          type: boolean
        email:
          type: string
        id:
          type: string
        metadata:
          type: string
          description: Base64 encoded bytes
        name:
          type: string
        updatedAt:
          type: string
          format: date-time
          example: 2026-02-01T18:37:21Z
      required:
        - id
        - createdAt
        - updatedAt
        - disabled
    UserListResponse:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        totalCount:
          type: integer
        users:
          type: array
          items:
            type: object
            properties:
              avatar:
                type: string
              banCounter:
                type: integer
              banExpiry:
                type: string
                format: date-time
                example: 2026-02-01T18:37:21Z
              banReason:
                type: string
              banned:
                type: boolean
              createdAt:
                type: string
                format: date-time
                example: 2026-02-01T18:37:21Z
              disabled:
                type: boolean
              email:
                type: string
              id:
                type: string
              metadata:
                type: string
                description: Base64 encoded bytes
              name:
