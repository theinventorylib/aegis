# GoReleaser configuration for Aegis CLI
# https://goreleaser.com

version: 2

before:
  hooks:
    # Ensure dependencies are up to date
    - go mod tidy

builds:
  # Build the CLI tool
  - id: aegis
    main: ./cmd/aegis
    binary: aegis
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: aegis-archive
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - cmd/aegis/README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'typo'
  groups:
    - title: Features
      regexp: '^feat:'
      order: 0
    - title: Bug Fixes
      regexp: '^fix:'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: theinventorylib
    name: aegis
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Aegis {{ .Tag }}
    
    ### Installation
    
    **Library:**
    ```bash
    go get github.com/theinventorylib/aegis@{{ .Tag }}
    ```
    
    **CLI:**
    ```bash
    go install github.com/theinventorylib/aegis/cmd/aegis@{{ .Tag }}
    ```
    
    Or download pre-built binaries below.
  
  footer: |
    **Full Changelog**: https://github.com/theinventorylib/aegis/compare/{{ .PreviousTag }}...{{ .Tag }}

