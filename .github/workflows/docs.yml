# Sample workflow for building and deploying a Nuxt site to GitHub Pages
#
# To get started with Nuxt see: https://nuxtjs.org/docs/get-started/installation
#
name: Deploy Nuxt site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: nuxt

      - name: Install dependencies
        run: pnpm install
        working-directory: docs

      - name: Sync Changelog from GitHub Releases
        run: |
          echo "---" > docs/content/changelog.md
          echo "title: Changelog" >> docs/content/changelog.md
          echo "description: Release history and updates for Aegis." >> docs/content/changelog.md
          echo "layout: default" >> docs/content/changelog.md
          echo "navigation:" >> docs/content/changelog.md
          echo "  icon: i-lucide-history" >> docs/content/changelog.md
          echo "---" >> docs/content/changelog.md
          echo "" >> docs/content/changelog.md
          echo "# Changelog" >> docs/content/changelog.md
          echo "" >> docs/content/changelog.md
          echo "The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)," >> docs/content/changelog.md
          echo "and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)." >> docs/content/changelog.md
          echo "" >> docs/content/changelog.md
          
          # Fetch releases from GitHub API
          curl -s "https://api.github.com/repos/${{ github.repository }}/releases" | \
          jq -r '.[] | "## [\(.tag_name)] - \(.published_at | split("T")[0])\n\n\(.body)\n\n---\n"' >> docs/content/changelog.md
          
          # If no releases exist, add a placeholder
          if [ $(wc -l < docs/content/changelog.md) -lt 15 ]; then
            echo "## [Unreleased]" >> docs/content/changelog.md
            echo "" >> docs/content/changelog.md
            echo "No releases yet. Check the [GitHub repository](https://github.com/${{ github.repository }}) for updates." >> docs/content/changelog.md
          fi

      - name: Build site
        run: pnpm generate
        working-directory: docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.output/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
