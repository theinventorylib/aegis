# Sample workflow for building and deploying a Nuxt site to GitHub Pages
#
# To get started with Nuxt see: https://nuxtjs.org/docs/get-started/installation
#
name: Deploy Nuxt site to Pages

on:
  # Rebuild/deploy the combined site on either release line. The site root is
  # always built from `main` and the v1 subpath from `v1` (see the checkouts
  # below), so the triggering ref does not change what gets published.
  push:
    branches: ["main", "v1"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (site root)
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Node 22+ is required by the current Nuxt/Vite toolchain
          # (Set.prototype.difference et al. are ES2024).
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: nuxt

      - name: Install dependencies
        run: pnpm install
        working-directory: docs

      - name: Sync Changelog from GitHub Releases
        run: bash docs/scripts/sync-changelog.sh .

      - name: Build site
        run: pnpm generate
        working-directory: docs

      # --- v1 line: build the previous major and serve it under /aegis/v1/ ---
      - name: Checkout v1 docs
        uses: actions/checkout@v6
        with:
          ref: v1
          path: v1-src

      - name: Install v1 docs dependencies
        run: pnpm install
        working-directory: v1-src/docs

      - name: Sync v1 changelog
        run: bash v1-src/docs/scripts/sync-changelog.sh v1-src

      - name: Build v1 site
        run: NUXT_APP_BASE_URL=/aegis/v1/ pnpm generate
        working-directory: v1-src/docs

      - name: Merge v1 site under /v1
        run: |
          mkdir -p docs/.output/public/v1
          cp -R v1-src/docs/.output/public/. docs/.output/public/v1/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.output/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
