name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (no actual release)"
        required: false
        default: false
        type: boolean
      skip_tests:
        description: "Skip tests (not recommended)"
        required: false
        default: false
        type: boolean
      use_goreleaser:
        description: "Use GoReleaser to build CLI binaries"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: go test -v ./...

      - name: Get current version
        id: get_version
        run: |
          # Get the latest tag, default to v0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

          # Strip 'v' prefix for version parsing
          VERSION=${LATEST_TAG#v}

          # Parse version components
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new_version
        run: |
          LATEST_TAG="${{ steps.get_version.outputs.latest_tag }}"

          # Check if latest tag is a beta/pre-release
          if [[ "$LATEST_TAG" =~ -beta\.[0-9]+$ ]]; then
            # Extract beta number
            BETA_NUM=$(echo "$LATEST_TAG" | grep -oP 'beta\.\K[0-9]+')
            BASE_VERSION=$(echo "$LATEST_TAG" | sed 's/-beta\.[0-9]\+$//')
            
            # Increment beta number for next beta release
            NEXT_BETA=$((BETA_NUM + 1))
            NEW_VERSION="${BASE_VERSION}-beta.${NEXT_BETA}"
            IS_PRERELEASE=true
          else
            # Regular version bump
            MAJOR=${{ steps.get_version.outputs.major }}
            MINOR=${{ steps.get_version.outputs.minor }}
            PATCH=${{ steps.get_version.outputs.patch }}
            
            case "${{ inputs.version_bump }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
            
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            IS_PRERELEASE=false
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION (prerelease: $IS_PRERELEASE)"

      - name: Generate changelog
        if: ${{ !inputs.use_goreleaser }}
        id: changelog
        run: |
          LATEST_TAG="${{ steps.get_version.outputs.latest_tag }}"
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          # Generate changelog from commits since last tag
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${LATEST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # If no commits, use a default message
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Patch release with bug fixes and improvements"
          fi

          # Save changelog to file for release notes
          echo "## What's Changed in ${NEW_VERSION}" > CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          echo "$CHANGELOG" >> CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LATEST_TAG}...${NEW_VERSION}" >> CHANGELOG_RELEASE.md

          cat CHANGELOG_RELEASE.md

      - name: Update changelog
        if: ${{ !inputs.use_goreleaser && !inputs.dry_run }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)

          # Extract the changelog content (remove header and footer)
          CHANGELOG_CONTENT=$(sed '1,2d; $d' CHANGELOG_RELEASE.md)

          # Update changelog.md by replacing [Unreleased] with new version and adding back [Unreleased]
          sed -i "s/## \[Unreleased\]/## [$NEW_VERSION] - $DATE\n$CHANGELOG_CONTENT\n\n## [Unreleased]/" docs/content/changelog.md

      - name: Commit changelog
        if: ${{ !inputs.use_goreleaser && !inputs.dry_run }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/content/changelog.md
          git commit -m "Update changelog for $NEW_VERSION"

      - name: Create and push tag
        if: ${{ !inputs.dry_run }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin "$NEW_VERSION"

      - name: Run GoReleaser
        if: ${{ !inputs.dry_run && inputs.use_goreleaser }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (without GoReleaser)
        if: ${{ !inputs.dry_run && !inputs.use_goreleaser }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.new_version.outputs.version }}
          name: Release ${{ steps.new_version.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: ${{ steps.new_version.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "## Dry Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Would create release: ${{ steps.new_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Options:" >> $GITHUB_STEP_SUMMARY
          echo "- Version bump: ${{ inputs.version_bump }}" >> $GITHUB_STEP_SUMMARY
          echo "- Use GoReleaser: ${{ inputs.use_goreleaser }}" >> $GITHUB_STEP_SUMMARY
          echo "- Skip tests: ${{ inputs.skip_tests }}" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ inputs.version_bump }}" == "patch" && "${{ inputs.use_goreleaser }}" == "false" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Changelog Preview:" >> $GITHUB_STEP_SUMMARY
            cat CHANGELOG_RELEASE.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Release summary
        if: ${{ !inputs.dry_run }}
        run: |
          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully created release: ${{ steps.new_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Details:" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ steps.new_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type: ${{ inputs.version_bump }}" >> $GITHUB_STEP_SUMMARY
          echo "- GoReleaser: ${{ inputs.use_goreleaser }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ !inputs.skip_tests && 'Passed' || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.new_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
