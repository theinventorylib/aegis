# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck        # Check for unchecked errors
    - gosimple        # Simplify code
    - govet           # Vet examines Go source code
    - ineffassign     # Detect ineffectual assignments
    - staticcheck     # Static analysis
    - unused          # Check for unused code
    - gofmt           # Check formatting
    - goimports       # Check import formatting
    - misspell        # Spell checker
    - revive          # Fast linter
    - gosec           # Security issues
    - unconvert       # Remove unnecessary conversions
    - unparam         # Unused function parameters
    - prealloc        # Find slice preallocation opportunities
    - exportloopref   # Check for loop variable capture
    - nilerr          # Find nil error returns
    - gocyclo         # Cyclomatic complexity
    - dupl            # Code duplication
    - goconst         # Repeated strings that could be constants
    - godot           # Check comments end in period
    - errname         # Check error naming conventions

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  
  govet:
    enable-all: true
    disable:
      - shadow  # Can be too noisy
  
  gocyclo:
    min-complexity: 15
  
  dupl:
    threshold: 100
  
  goconst:
    min-len: 3
    min-occurrences: 3
  
  misspell:
    locale: US
  
  revive:
    rules:
      - name: exported
        disabled: false
      - name: var-naming
        disabled: false
      - name: package-comments
        disabled: false
  
  gosec:
    excludes:
      - G404  # Use of weak random number generator - we use crypto/rand where needed
  
  goimports:
    local-prefixes: github.com/theinventorylib/aegis

issues:
  exclude-rules:
    # Exclude test files from certain linters
    - path: _test\.go
      linters:
        - errcheck
        - dupl
        - gosec
    
    # Exclude generated files
    - path: ".*\\.pb\\.go"
      linters:
        - all
    
    # Exclude examples from documentation checks
    - path: examples/
      linters:
        - errcheck
        - godot
  
  # Maximum issues count per one linter
  max-issues-per-linter: 50
  
  # Maximum count of issues with the same text
  max-same-issues: 3
  
  # Show only new issues
  new: false

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
