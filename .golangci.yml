# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck        # Check for unchecked errors
    - govet           # Vet examines Go source code
    - ineffassign     # Detect ineffectual assignments
    - staticcheck     # Static analysis (includes gosimple)
    - unused          # Check for unused code
    - misspell        # Spell checker
    - revive          # Fast linter
    - gosec           # Security issues
    - unconvert       # Remove unnecessary conversions
    - unparam         # Unused function parameters
    - prealloc        # Find slice preallocation opportunities
    - nilerr          # Find nil error returns
    - gocyclo         # Cyclomatic complexity
    - dupl            # Code duplication
    - goconst         # Repeated strings that could be constants
    - errname         # Check error naming conventions
  
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    
    govet:
      enable-all: true
      disable:
        - shadow          # Can be too noisy
        - fieldalignment  # Micro-optimization, breaks readability
    
    gocyclo:
      min-complexity: 30
    
    dupl:
      threshold: 150
    
    goconst:
      min-len: 3
      min-occurrences: 3
    
    misspell:
      locale: US
    
    revive:
      rules:
        - name: exported
          disabled: false
        - name: var-naming
          disabled: false
        - name: package-comments
          disabled: false
    
    gosec:
      excludes:
        - G404  # Use of weak random number generator - we use crypto/rand where needed
        - G117  # Exported struct field matches secret pattern - expected in an auth library
  
  exclusions:
    rules:
      # Exclude test files from certain linters
      - path: '_test\.go'
        linters:
          - errcheck
          - dupl
          - gosec
      
      # Exclude generated files
      - path: '.*\.pb\.go'
        linters:
          - all
      
      # Exclude errcheck from examples and testing helpers
      - path: examples/
        linters:
          - errcheck
      
      - path: testing/
        linters:
          - errcheck
          - revive
      
      # Exclude errcheck for intentionally ignored audit logs
      - path: 'core/(account|email_password|session|ratelimit)\.go'
        linters:
          - errcheck
        text: 'auditLogger\.LogAuthEvent'
      
      # Exclude duplication in route metadata registration
      - path: 'plugins/organizations/organizations\.go'
        linters:
          - dupl
        text: 'RegisterRouteMetadata'

issues:
  # Maximum issues count per one linter
  max-issues-per-linter: 50
  
  # Maximum count of issues with the same text
  max-same-issues: 3
  
  # Show only new issues
  new: false


